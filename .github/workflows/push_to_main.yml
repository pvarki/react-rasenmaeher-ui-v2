name: Build and Push Rasenmaeher UI Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The ODMDM connector release the images serve (README.md): the tag and its archive's SHA-256 change together
env:
  MDM_CONNECTOR_URL: https://github.com/pvarki/python-odmdm-fleet/releases/download/v1.6.0%2B261123/mdm-connector.tar.gz
  MDM_CONNECTOR_SHA256: 2bc4de2c70fee8bdf8905c19521d17b7ce92f73fd2182f1a48f5b80ba0bbc628 # pragma: allowlist secret

jobs:
  publish_nginx:
    name: Publish NGinx Docker image (${{ matrix.theme }})
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        theme: [default, fdf]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Publish Docker image
        uses: pvarki/config-ci-library/.github/actions/publish-image@main
        with:
          product: rasenmaeher-${{ matrix.theme }}
          component: ui
          target: k8s_nginx
          build-args: |
            VITE_THEME=${{ matrix.theme }}
            MDM_CONNECTOR_URL=${{ env.MDM_CONNECTOR_URL }}
            MDM_CONNECTOR_SHA256=${{ env.MDM_CONNECTOR_SHA256 }}
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          acr-repo: ${{ vars.ACR_REPO }}
          acr-username: ${{ vars.ACR_USERNAME }}
          acr-token: ${{ secrets.ACR_TOKEN }}

  publish_files:
    name: Publish file delivery Docker image (${{ matrix.theme }})
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        theme: [default, fdf]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Publish Docker image
        uses: pvarki/config-ci-library/.github/actions/publish-image@main
        with:
          product: rasenmaeher-ui-${{ matrix.theme }}
          component: worker
          target: production
          build-args: |
            VITE_THEME=${{ matrix.theme }}
            MDM_CONNECTOR_URL=${{ env.MDM_CONNECTOR_URL }}
            MDM_CONNECTOR_SHA256=${{ env.MDM_CONNECTOR_SHA256 }}
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          acr-repo: ${{ vars.ACR_REPO }}
          acr-username: ${{ vars.ACR_USERNAME }}
          acr-token: ${{ secrets.ACR_TOKEN }}
