version: v2beta1
name: rasenmaeher-fdf-ui

images:
  ui:
    image: ghcr.io/pvarki/rasenmaeher-fdf-ui
    dockerfile: ./Dockerfile
    context: ./
    target: dev
    skipPush: true
    buildKit: {}
    buildArgs:
      VITE_THEME: fdf

pipelines:
  dev: |-
    build_images --all
    start_dev --all

dev:
  app-ui:
    labelSelector:
      app: rmui
    namespace: opendefence-system
    container: app-ui-nginx
    devImage: ${runtime.images.ui}
    sync:
      - path: ./src:/app/src
      - path: ./public:/app/public
      - path: ./index.html:/app/index.html
    logs: {}
    # Dev pod only: the deployment's 128Mi limit OOM-kills pnpm + Vite.
    patches:
      - op: replace
        path: spec.containers[0].resources
        value:
          limits:
            memory: 3Gi
          requests:
            # Small so it still schedules on the nearly full kind node.
            cpu: 50m
            memory: 200Mi
