server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;
    # A redirect (/mdm-connector to /mdm-connector/) names only the path, never this container's scheme and port
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The ODMDM connector's release files (Dockerfile, MDM_CONNECTOR_URL): only the files there,
    # never the app's page in place of a missing one, which a browser would save as the download
    location /mdm-connector/ {
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Names the files of the release in this image, so never kept past an upgrade
    location = /mdm-connector/connector.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
